spring:
  application:
    name: assurance-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/assurance?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8099}

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration-web: ${JWT_REFRESH_EXPIRATION_WEB:1296000000}
  refresh-token-expiration-mobile: ${JWT_REFRESH_EXPIRATION_MOBILE:7776000000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@jway.ma}
    admin-password: ${ADMIN_PASSWORD:password}
    villes-sql: ${VILLES_SQL:}

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
